name: Feature
description: A new capability or a change to an existing one.
labels: ["type:feature", "status:triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they do today.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Start from the command(s) — names, inputs, tier — then the surfaces.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [identity, raids, coordinator, polls, progress, loot, wishlist, site, agent, guild-kit, api, web, addon, repo, labs]
