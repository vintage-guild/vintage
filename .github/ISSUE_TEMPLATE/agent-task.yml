name: Agent task
description: A bounded piece of work an agent (or a person) can pick up and finish in one PR.
labels: ["status:triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What exists today, with file paths. Link the PLAN.md section or feature doc.
    validations: { required: true }
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome in one or two sentences.
    validations: { required: true }
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this task must not change.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks. For commands, list inputs, tiers, and expected results or error codes.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [identity, raids, coordinator, polls, progress, loot, wishlist, site, agent, applications, guild-kit, api, web, addon, repo]
    validations: { required: true }
