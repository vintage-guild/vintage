<!doctype html>
<html lang="en" data-theme="vintage-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vintage, a guild on WoW: Forever: recruitment, raids, and the member area." />
    <meta name="color-scheme" content="dark light" />
    <title>Vintage</title>
    <!-- The square emblem (assets/brand/vintage-emblem.png): its double outline reads on light and dark tab bars. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#100f15" />
    <!-- The display face, fetched before the stylesheet that asks for it so the hero headline
         paints in Bitter rather than swapping in. One file: Bitter is variable, so it covers every
         weight; only the latin, upright subset is above the fold. The path resolves to the same
         hashed asset as @fontsource-variable/bitter's CSS in the build (src/preload.test.ts). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/bitter/files/bitter-latin-wght-normal.woff2" />
    <style>
      /* First paint, before the stylesheets and the header element load: the theme's canvas and
         text (literal copies of --color-surface-canvas / --color-text-primary, kept equal by
         src/first-paint.test.ts), and the header hidden at its own height so the inline logo
         never paints page-wide in the link color. */
      html { background: #100f15; color: #faf5ea; }
      html[data-theme='vintage-parchment'] { background: #f3ead7; color: #2b2118; }
      vintage-logo-header:not(:defined) { display: block; min-block-size: 4.1rem; visibility: hidden; }
      /* Nothing shows until the first page has rendered (main.ts sets data-ready, capped at
         2.5s), so the header and footer art never appear ahead of the page. */
      body > :not(script) { transition: opacity 0.2s ease-out; }
      html:not([data-ready]) body > :not(script) { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { body > :not(script) { transition: none; } }
    </style>
    <!-- The saved theme and the reveal fallback, before first paint. A file, not inline: the CSP
         (vercel.json) runs only our own scripts. -->
    <script src="/first-paint.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <vintage-logo-header heading="">
      <a slot="logo" href="/"><span class="visually-hidden">Vintage home</span><!-- brand:logo --></a>
      <a href="/" data-section-link="top">Home</a>
      <a href="/#raids" data-section-link="raids">Raids</a>
      <a href="/#progress" data-section-link="progress">Progress</a>
      <a href="/#recruiting" data-section-link="recruiting">Recruiting</a>
      <a href="/#roster" data-section-link="roster">Roster</a>
      <a href="/#news" data-section-link="news">News</a>
      <button slot="member" id="sign-in" class="sign-in" type="button" hidden>Sign in</button>
      <vintage-member-menu slot="member" id="member-menu" hidden></vintage-member-menu>
    </vintage-logo-header>
    <main id="content" tabindex="-1">
      <fast-router></fast-router>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <div class="fine">
          <span>Vintage · a guild on WoW: Forever · updated <time id="updated"></time></span>
          <small>World of Warcraft is a trademark of Blizzard Entertainment. Vintage is a player guild, not affiliated with Blizzard.</small>
        </div>
        <nav aria-label="Footer">
          <a href="/about">About</a>
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
