<!doctype html>
<html lang="en" data-theme="vintage-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vintage, a guild on WoW: Forever: recruitment, raids, and the member area." />
    <meta name="color-scheme" content="dark light" />
    <title>Vintage</title>
    <!-- The square emblem (assets/brand/vintage-emblem.png): its double outline reads on light and dark tab bars. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#100f15" />
    <script>
      // Apply the saved theme before first paint (src/theme.ts owns the key and values).
      try {
        const saved = localStorage.getItem('vintage-theme');
        if (saved === 'vintage-dark' || saved === 'vintage-parchment') {
          document.documentElement.dataset.theme = saved;
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <vintage-logo-header heading="">
      <a slot="logo" href="/"><span class="visually-hidden">Vintage home</span><!-- brand:logo --></a>
      <a href="/" data-section-link="top">Home</a>
      <a href="/#raids" data-section-link="raids">Raids</a>
      <a href="/#progress" data-section-link="progress">Progress</a>
      <a href="/#recruiting" data-section-link="recruiting">Recruiting</a>
      <a href="/#roster" data-section-link="roster">Roster</a>
      <a href="/#news" data-section-link="news">News</a>
      <button slot="member" id="sign-in" class="sign-in" type="button" hidden>Sign in</button>
      <vintage-member-menu slot="member" id="member-menu" hidden></vintage-member-menu>
    </vintage-logo-header>
    <main id="content" tabindex="-1">
      <fast-router></fast-router>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <span>Vintage · a guild on WoW: Forever · updated <time id="updated"></time></span>
        <nav aria-label="Footer">
          <a href="/about">About</a>
          <a href="https://github.com/vintage-guild/vintage" rel="noopener">GitHub</a>
          <a href="https://github.com/lushly-dev/afd" rel="noopener">Built on AFD</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
