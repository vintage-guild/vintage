name: Bug
description: Something does the wrong thing.
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command name and its CommandResult (error code, message) if you have it.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Surface (website, Discord, MCP, CLI, addon), your tier, and the steps.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [identity, raids, coordinator, polls, progress, loot, wishlist, site, guild-kit, api, web, addon, repo]
