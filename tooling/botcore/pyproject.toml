[project]
name = "botcore-vintage"
version = "0.1.0"
description = "Vintage repo tooling for botcore: module scaffolding and repo checks, for humans, CI, and agents"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
dependencies = [
    "lushly-botcore>=0.2.0",
]

[project.scripts]
vintagebot = "botcore_vintage.cli:main"

[project.entry-points."botcore.plugins"]
vintage = "botcore_vintage.plugin:VintagePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore_vintage"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
